spring.application.name=file-service
server.port=8080
#Eureka
eureka.client.serviceUrl.defaultZone=http://${discovery.host}:${discovery.port}/eureka/
#Jpa
spring.datasource.url=jdbc:postgresql://${file.datasource.host}:${file.datasource.port}/${file.datasource.database}
spring.datasource.username=${file.datasource.username}
spring.datasource.password=${file.datasource.password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Observability
management.health.readinessState.enabled=true
management.health.livenessState.enabled=true
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=file-service
#RabbitMQ
spring.rabbitmq.host=${rabbit.host}
spring.rabbitmq.port=${rabbit.port}
spring.rabbitmq.username=${rabbit.username}
spring.rabbitmq.password=${rabbit.password}
app.files.default-root-dir-prefix-name=Root
#Logging
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.com.crm.file=DEBUG
#App
#Max size of file in bytes
app.file.max-size=15728640
spring.servlet.multipart.max-file-size=36MB
spring.servlet.multipart.max-request-size=36MB